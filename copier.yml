# Questions specific to this template




# Questions managed by upstream template
repo_name:
    type: str
    help: What is the name of the repository?

repo_org_name:
    type: str
    help: What's the organization or username that owns this repository (look in the URL)?

description:
    type: str
    help: What is the description of this repository?

install_claude_cli:
    type: bool
    help: Should the Claude CLI be installed in the devcontainer?
    default: no

is_open_source:
    type: bool
    help: Is this library open source?
    default: no

ssh_port_number:
    type: int
    help: What port should the devcontainer bind SSH to?
    # Pick a random port, but ensure it's not in the excluded port range on Windows (powershell: `netsh int ipv4 show excludedportrange protocol=tcp`)
    default: "{{ ( (range(49152, 49752)   | list) + (range(49852, 50000)   | list) + (range(50060, 50160)   | list) + (range(50160, 50260)   | list) + (range(50260, 50360)   | list) + (range(50914, 51014)   | list) + (range(51114, 51214)   | list) + (range(51214, 51314)   | list) + (range(51314, 51414)   | list) + (range(51623, 51723)   | list) + (range(51723, 51823)   | list) + (range(65269, 65369)   | list) + (range(65369, 65469)   | list) ) | random }}"

pull_from_ecr:
    type: bool
    help: Will you need to pull images from a central AWS Elastic Container Registry?
    default: no

use_windows_in_ci:
    type: bool
    help: Should CI in the instantiated template also use Windows runners?
    default: no

node_version:
    type: str
    help: What version of NodeJS is used for development?
    default: "{{ default_node_version }}"




# Questions specific to this template
npm_org_name:
    type: str
    help: "npm organization name for scoped packages and publish auth (e.g. 'my-org' → @my-org/...). Leave blank for unscoped packages."
    default: "{{repo_org_name}}"

npm_package_name:
    type: str
    help: "Full npm package name (e.g. my-module or @org/my-module)"
    default: "{% if npm_org_name %}@{{ npm_org_name }}/{{ repo_name }}{% else %}{{ repo_name }}{% endif %}"

npm_package_registry:
    type: str
    help: Where is this npm package published?
    choices:
        - npm
        - AWS CodeArtifact
    default: "{% if is_open_source %}npm{% else %}AWS CodeArtifact{% endif %}"



# Questions managed by upstream template

repo_names_for_codespaces_read_permissions:
    type: str
    help: Provide a comma-separated list of repository names only within this GitHub organization that you would like the codespace to have read access to (for example, private-template, not my-org/private-template)
    default: ""
pnpm_minimum_release_age_exclude:
    type: str
    help: "Comma-delimited list of package name patterns to exclude from pnpm's minimumReleaseAge constraint (leave empty for none)"
    default: ""


_tasks:
  - command: |
        python3 '{{ _copier_conf.src_path }}/src/copier_tasks/remove_precommit_hooks.py' \
            --hook-id-regex '^\s*-\s+id:\s+merge-claude-settings\s*$' \
            --target-file .pre-commit-config.yaml
    when: "{{ not install_claude_cli }}"
  # Copier does not preserve executable permissions when instantiating the template, so we set them explicitly here.
  # git update-index is also needed because with core.fileMode=false (common on WSL2) git ignores the on-disk exec bit,
  # so a plain `git add` would not capture it. It is guarded on the file being tracked, since on an initial `copier copy`
  # into a fresh repo the file is not in the index yet (the chmod alone covers that case).
  - command: |
        if [ -f scripts/delete_false_positive_rej.py ]; then
            chmod +x scripts/delete_false_positive_rej.py
            if git ls-files --error-unmatch scripts/delete_false_positive_rej.py > /dev/null 2>&1; then
                git update-index --chmod=+x scripts/delete_false_positive_rej.py
            fi
        fi
  - command: |
        for script in .claude/skills/address-pr-comments/check-footer.py .claude/skills/address-pr-comments/commit-link.py .claude/skills/address-pr-comments/fetch-pr-comments.py .claude/skills/address-pr-comments/post-reply.py .claude/skills/address-pr-comments/verify-env.py; do
            if [ -f "$script" ]; then
                chmod +x "$script"
                if git ls-files --error-unmatch "$script" > /dev/null 2>&1; then
                    git update-index --chmod=+x "$script"
                fi
            fi
        done
  - command: |
        export PNPM_PATTERNS='{{ pnpm_minimum_release_age_exclude }}'
        python3 '{{ _copier_conf.src_path }}/src/copier_tasks/ensure_pnpm_minimum_release_age_exclude.py' --patterns "$PNPM_PATTERNS"
    when: "{{ pnpm_minimum_release_age_exclude }}"
  - command: |
        if [ -f .config/ruff.toml ]; then
            echo "Updating ruff target-version from python_version..."
            py_major_minor="$(printf '%s' '{{ python_version }}' | cut -d. -f1,2)"
            py_tag="py$(printf '%s' "$py_major_minor" | tr -d '.')"
            sed -i -E 's/^target-version = "py[0-9]+"/target-version = "'"$py_tag"'"/' .config/ruff.toml
        else
            echo ".config/ruff.toml not found; skipping Ruff target-version update."
        fi
  - command: |
        python3 '{{ _copier_conf.src_path }}/src/copier_tasks/copier_provenance.py' \
            '{{ _copier_conf.src_path }}/template' \
            '.' \
            --template-src '{{ _src_path }}'

# Additional Settings
_min_copier_version: "9.8"

_answers_file: "./.copier-answers.yml"

_subdirectory: template

_templates_suffix: .jinja

_exclude:
    - "copier.yml"

# adapted from https://github.com/copier-org/copier-template-extensions#context-hook-extension
_jinja_extensions:
- copier_template_extensions.TemplateExtensionLoader
- extensions/context.py:ContextUpdater
